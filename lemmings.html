<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta
      name="Description"
      content="Lemmings, played on top of sandspiel's falling sand: dig, bash and build through sand, water, lava and fire to lead the lemmings home."
    />
    <meta name="theme-color" content="#121017" />
    <title>sandspiel lemmings</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Inconsolata:400,700"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="game">
      <header id="topbar">
        <a href="/" class="brand">sandspiel</a>
        <span class="brand-sub">lemmings</span>
        <span id="level-name"></span>
        <button id="levels" class="small" title="Level select">levels</button>
        <button id="restart" class="small" title="Restart (R)">retry</button>
        <button id="music" class="small" title="Music (B)">music on</button>
        <button id="sound" class="small" title="Sound (M)">sound on</button>
      </header>

      <div id="stage">
        <canvas id="fluid-canvas"></canvas>
        <canvas id="sand-canvas"></canvas>
        <canvas id="lem-canvas"></canvas>

        <div id="card" class="hidden"></div>
      </div>

      <div id="status">
        <span id="hover-info"></span>
        <span class="stat">OUT <b id="stat-out">0</b></span>
        <span class="stat">IN <b id="stat-in">0%</b></span>
        <span class="stat">TIME <b id="stat-time">0-00</b></span>
      </div>

      <div id="toolbar">
        <div id="panel">
          <button id="rate-down" class="pbtn" title="Slower release (-)">
            <span class="count" id="rate-min">50</span><canvas width="32" height="32"></canvas>
          </button>
          <button id="rate-up" class="pbtn" title="Faster release (+)">
            <span class="count" id="rate">50</span><canvas width="32" height="32"></canvas>
          </button>
          <div id="skills"></div>
          <button id="pause" class="pbtn tool" title="Pause (P)">
            <span class="count"></span><canvas width="32" height="32"></canvas>
          </button>
          <button id="fast" class="pbtn tool" title="Fast forward (F)">
            <span class="count"></span><canvas width="32" height="32"></canvas>
          </button>
          <button id="nuke" class="pbtn tool" title="Nuke (N, twice)">
            <span class="count"></span><canvas width="32" height="32"></canvas>
          </button>
        </div>
        <canvas id="minimap" width="240" height="240" title="Overview"></canvas>
      </div>
    </div>
  </body>
</html>
